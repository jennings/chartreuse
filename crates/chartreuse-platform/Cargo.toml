[package]
name = "chartreuse-platform"
description = "Chartreuse platform traits and per-OS backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chartreuse-core.workspace = true
futures.workspace = true
parking_lot = "0.12.5"
raw-window-handle = "0.6.2"
tracing.workspace = true

# The shared macOS bindings (see the workspace manifest). Declared up front so the
# macOS tracks never need to edit this file.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
# `NSSavePanel.allowedContentTypes` (UTType) is behind this feature.
objc2-app-kit = { workspace = true, features = ["objc2-uniform-type-identifiers"] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-screen-capture-kit.workspace = true
objc2-uniform-type-identifiers.workspace = true

[target.'cfg(windows)'.dependencies]
chartreuse-imaging.workspace = true
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
chartreuse-imaging.workspace = true

[lints]
workspace = true
