[package]
name = "chartreuse-editor"
description = "Chartreuse document model, tools, and editor canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chartreuse-core.workspace = true
chartreuse-imaging.workspace = true
iced.workspace = true
# Typed text arrives from iced as a SmolStr; the same version iced uses.
smol_str = "0.2.2"
# Backspace deletes a whole grapheme cluster (already in the tree via
# cosmic-text).
unicode-segmentation = "1.13.3"

[dev-dependencies]
# The editor_harness example opens an editor on the fake backend's test pattern.
chartreuse-platform.workspace = true
# Tests drive the canvas's widget tree headlessly through `UserInterface`,
# which iced does not re-export. Same version as `iced`.
iced_runtime = "=0.14.0"

[lints]
workspace = true
