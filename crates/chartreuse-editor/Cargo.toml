[package]
name = "chartreuse-editor"
description = "Chartreuse document model, tools, and editor canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chartreuse-core.workspace = true
chartreuse-imaging.workspace = true
iced.workspace = true
# Typed text arrives from iced as a SmolStr; the same version iced uses.
smol_str = "0.2.2"
# Backspace deletes a whole grapheme cluster (already in the tree via
# cosmic-text).
unicode-segmentation = "1.13.3"

[lints]
workspace = true
