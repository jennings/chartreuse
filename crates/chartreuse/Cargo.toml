[package]
name = "chartreuse"
description = "Chartreuse screenshot and annotation tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chartreuse-config.workspace = true
chartreuse-core.workspace = true
chartreuse-editor.workspace = true
chartreuse-imaging.workspace = true
chartreuse-overlay.workspace = true
chartreuse-platform.workspace = true
iced.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Local time for saved file names.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The platform's Pictures folder, the default save directory.
dirs = "6.0.0"

[dev-dependencies]
futures.workspace = true
# Tests inspect the actions a `Task` performs (e.g. that Quit exits); iced does
# not re-export `task::into_stream`. Same version as `iced`.
iced_runtime = "=0.14.0"
tempfile = "3.27.0"

[features]
# Build the release flavor (see `chartreuse_core::flavor`). Set by
# `cargo xtask release` only.
release-flavor = ["chartreuse-core/release-flavor"]

[lints]
workspace = true
