[package]
name = "chartreuse-config"
description = "Chartreuse settings schema and persistence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chartreuse-core.workspace = true
chartreuse-imaging.workspace = true
chrono.workspace = true
# The platform's standard folders (settings, pictures, home).
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
# Atomic writes of the settings file.
tempfile.workspace = true
# TOML that keeps comments, formatting and unknown keys when saving, with
# serde (de)serialization and error spans.
toml_edit = { version = "0.25.15", features = ["serde"] }
tracing.workspace = true

[lints]
workspace = true
