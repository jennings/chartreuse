<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The Chartreuse app icon: selection corners around a crosshair, on a rounded
    square in the build flavor's accent color. The body sits on the macOS icon
    grid (an 824-unit square with a 185-unit corner radius, centered on the
    1024-unit canvas).

    The `accent` fill is the release accent; `cargo xtask` overrides it with a
    style sheet for the development flavor. Rendered by `xtask/src/icon.rs`.
  -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect class="accent" x="100" y="100" width="824" height="824" rx="185" fill="#80ff00" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <g fill="none" stroke="#161616" stroke-width="80" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 422V262H422M602 262H762V422M762 602V762H602M422 762H262V602"/>
    <path d="M512 442V582M442 512H582"/>
  </g>
</svg>
