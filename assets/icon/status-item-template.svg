<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!--
    The macOS status item template image: the app icon's mark (selection corners
    around a crosshair) in black on transparent, for an 18-point menu bar icon.
    AppKit tints template images for the menu bar's appearance, so only the
    alpha channel matters. Strokes are 2 units wide and centered on whole units
    with square ends, so every edge falls on a pixel boundary at 1x and 2x.
    Rendered into `assets/icon/generated/` by `cargo xtask icons`.
  -->
  <g fill="none" stroke="#000000" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M3 7V3H7M11 3H15V7M15 11V15H11M7 15H3V11"/>
    <path d="M9 6V12M6 9H12"/>
  </g>
</svg>
